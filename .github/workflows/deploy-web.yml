name: Deploy Web (EAS Hosting)

on:
  push:
    branches:
      - web
  workflow_dispatch:
    inputs:
      app_ref:
        description: Branch or tag of the app to build the website from
        required: false
        default: feature/investorflip-v1

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout app code (read-only)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.app_ref || 'feature/investorflip-v1' }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Export web bundle
        env:
          EXPO_PUBLIC_BACKEND_URL: https://investorflipapi-production-4970.up.railway.app
        run: npx expo export --platform web --output-dir dist

      - name: Deploy to EAS Hosting
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas deploy --prod --non-interactive
